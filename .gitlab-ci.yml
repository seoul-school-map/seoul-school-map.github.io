# GitLab Pages 배포 설정 (2026-09-28)
# 기본 브랜치에 올리면(push) 대시보드 화면만 public/ 폴더로 모아 GitLab Pages로 공개한다.
# - 공개되는 것: 서울학교공간지도/서울학교공간지도.html(→ index.html), 서울학교공간지도/data/*.js, demo.mp4(소개 영상)
# - 공개되지 않는 것(저장소에는 있음): Claude outputs/, 참고자료, 수집기·변환 도구(연락처수집기·학생수수집기·공시변환기·좌표수집기), 검사/, 문서(.md), 엑셀
#   (도구는 인증키를 넣어 쓰는 관리자용이라 로컬에서만 연다. API연결점검·data/config.js(실시간 조회)는 2026-10-02, 좌표점검·백업 HTML은 2026-10-03 삭제)
# 러너가 외부 이미지를 못 받는 내부망이면 image 줄을 지우고 shell 러너에서 돌려도 된다(쓰는 명령은 mkdir·cp뿐).
image: alpine:latest

pages:
  stage: deploy
  # gitlab.aigov.go.kr의 인스턴스 러너(운영자 제공, 2026-10-05 확인)는 이 태그가 붙은 작업만 받는다. 없으면 "러너 없음"으로 멈춤
  tags:
    - security-deploy
  script:
    - mkdir -p public/data
    - cp 서울학교공간지도/서울학교공간지도.html public/index.html
    - cp 서울학교공간지도/data/*.js public/data/
    - cp -r 서울학교공간지도/icons public/icons   # 홈 화면·탭 아이콘(2026-10-30)
    - cp demo.mp4 public/demo.mp4   # 소개 영상(2026-10-29)
    # 인증키 이름(serviceKey·apiKey·authKey 등)이 든 data 파일이 실수로 공개되지 않도록 막는다(지금 data/*.js에는 없어야 정상).
    # -q: 해당 줄을 작업 로그에 찍지 않게 조용히 검사만 한다.
    - "if grep -qiE 'servicekey|apikey|authkey' public/data/*.js; then echo '서울학교공간지도/data/*.js에 인증키 이름이 들어 있어 배포를 멈춥니다. 확인하고 다시 올려 주세요.'; exit 1; fi"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
