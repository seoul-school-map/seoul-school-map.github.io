// ---------------- 4-b) 반경 밖 지역(옛 이름 "접근성 공백") ----------------
// 2026-10-02 이름과 색을 바꿈: "공백"과 빨간 격자는 "부족하다"는 판정으로 읽혀서(기획 원칙). 중립 남회색, 목록은 가나다순.
// "기준 학교(현재 시설·학교급 조건에서 개방 중인 학교)가 반경 R 안에 하나도 없는 지역"을 500m 격자로 찾는다.
// 직선거리 기준의 근사값이며, 자치구 경계 데이터(단순화됨) 안쪽 격자만 대상으로 한다.
// 비거주지 제외(2026-10-02): 토지이용·인구 자료가 없어, 개방 여부와 상관없이 "어느 학교든 1km 안에 있는 격자"만
// 사람이 사는 곳으로 추정해 분석한다. 북한산·관악산·수락산·우면산 등 큰 산(약 78㎢)은 빠지지만 한강·남산·인왕산 등은 남는다.
// 병설·같은 부지 학교를 한 곳으로 묶는 처리는 "가장 가까운 학교까지 거리"에 영향이 없어 따로 하지 않는다.
const GAP_RESIDENTIAL_M = 1000;
function buildGrid() {
  if (gridInfo) return gridInfo;
  const midLat = 37.55;
  const cosLat = Math.cos(midLat * Math.PI / 180);
  const dLat = 500 / 111320, dLng = 500 / (111320 * cosLat);
  // 경계 폴리곤 좌표계 → 학교 좌표계로 옮기려면 보정값을 빼준다
  const minLat = SEOUL_BBOX.minLat - DISTRICT_BOUNDARY_OFFSET_LAT;
  const maxLat = SEOUL_BBOX.maxLat - DISTRICT_BOUNDARY_OFFSET_LAT;
  const minLng = SEOUL_BBOX.minLng - DISTRICT_BOUNDARY_OFFSET_LNG;
  const maxLng = SEOUL_BBOX.maxLng - DISTRICT_BOUNDARY_OFFSET_LNG;
  const rows = Math.ceil((maxLat - minLat) / dLat), cols = Math.ceil((maxLng - minLng) / dLng);
  const allSch = SCHOOLS.filter(s => !s.noCoord);
  const resM2 = GAP_RESIDENTIAL_M * GAP_RESIDENTIAL_M;
  const nearAnySchool = (lat, lng) => allSch.some(s => {
    const dy = (s.lat - lat) * 111320, dx = (s.lng - lng) * 111320 * cosLat;
    return dx * dx + dy * dy <= resM2;
  });
  const cells = [];
  let excluded = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const lat = minLat + (r + 0.5) * dLat, lng = minLng + (c + 0.5) * dLng;
      const d = findContainingDistrict(lng, lat);
      if (!d) continue;
      if (!nearAnySchool(lat, lng)) { excluded++; continue; }
      cells.push({ r, c, lat, lng, d, o: OFFICE_OF_DISTRICT[d] || '미분류', dist: Infinity });
    }
  }
  gridInfo = { cells, excluded, dLat, dLng, minLat, minLng, cosLat, areaKm2: (dLat * 111320) * (dLng * 111320 * cosLat) / 1e6 };
  return gridInfo;
}
function analysisSchools() {
  return SCHOOLS.filter(s => !s.noCoord && effectiveOpen(s) && (!activeLevels.size || activeLevels.has(s.level)) && foundFilterOk(s));
}
function computeGapDistances() {
  const key = `${[...activeFacilities].sort().join(',')}|${[...activeLevels].sort().join(',')}|${[...activeFounds].sort().join(',')}`;
  const g = buildGrid();
  if (key === gapDistKey) return g;
  const sch = analysisSchools();
  g.cells.forEach(cell => {
    let best = Infinity;
    for (const s of sch) {
      const dy = (s.lat - cell.lat) * 111320, dx = (s.lng - cell.lng) * 111320 * g.cosLat;
      const d2 = dx * dx + dy * dy;
      if (d2 < best) best = d2;
    }
    cell.dist = Math.sqrt(best);
  });
  g.schoolCount = sch.length;
  gapDistKey = key;
  gapFullKey = '';
  return g;
}
function clearGapShapes() {
  gapShapes.forEach(sh => sh.setMap(null));
  gapShapes = [];
}
function drawGapShapes(gapCells, g) {
  const byRow = {};
  gapCells.forEach(c => { (byRow[c.r] = byRow[c.r] || []).push(c.c); });
  Object.keys(byRow).forEach(rk => {
    const r = +rk;
    const cols = byRow[rk].sort((a, b) => a - b);
    // 가로로 이어진 격자는 하나의 사각형으로 합쳐 도형 수를 줄인다
    const flush = (s, e) => {
      const sw = new kakao.maps.LatLng(g.minLat + r * g.dLat, g.minLng + s * g.dLng);
      const ne = new kakao.maps.LatLng(g.minLat + (r + 1) * g.dLat, g.minLng + (e + 1) * g.dLng);
      const rect = new kakao.maps.Rectangle({
        bounds: new kakao.maps.LatLngBounds(sw, ne), strokeWeight: 0, fillColor: '#5B6B8C', fillOpacity: 0.35
      });
      rect.setMap(map);
      gapShapes.push(rect);
    };
    let start = cols[0], prev = cols[0];
    for (let i = 1; i < cols.length; i++) {
      if (cols[i] === prev + 1) { prev = cols[i]; continue; }
      flush(start, prev);
      start = prev = cols[i];
    }
    flush(start, prev);
  });
}
function setGapM(v) {
  gapM = v;
  renderRadiusChips('gapChips', gapM, [500, 1000, 2000, 3000], setGapM);
  renderGap();
  updateLegend();   // 범례에 반경이 적혀 있어 함께 갱신
}
function renderGap() {
  const box = document.getElementById('gapResult');
  const g = computeGapDistances();
  if (!g.schoolCount) {
    clearGapShapes();
    gapFullKey = '';
    box.innerHTML = `<div class="mp-hint">기준 학교가 없어 분석할 수 없습니다. (${critLabel()} · ${levelCritLabel()})</div>`;
    return;
  }
  const key = `${gapDistKey}|${gapM}|${groupUnit}`;
  if (key === gapFullKey) return;
  gapFullKey = key;
  const gapCells = g.cells.filter(c => c.dist > gapM);
  clearGapShapes();
  if (mapAvailable) drawGapShapes(gapCells, g);
  const per = {};
  g.cells.forEach(c => {
    const k = groupUnit === 'office' ? c.o : c.d;
    const p = per[k] || (per[k] = { n: 0, gap: 0 });
    p.n++;
    if (c.dist > gapM) p.gap++;
  });
  const rows = Object.entries(per).map(([k, p]) => ({ k, ...p, pct: p.gap / p.n })).sort((a, b) => a.k.localeCompare(b.k, 'ko'));   // 비율 순으로 세우면 순위표처럼 읽혀서 가나다순(2026-10-02)
  const A = g.areaKm2;
  box.innerHTML = `
    <div class="mp-sum">기준: <b>${critLabel()}</b> · ${levelCritLabel()} (서울 전체 <b>${fmtNum(g.schoolCount)}</b>개교)<br>
      반경 ${fmtR(gapM)} 안에 기준 학교가 없는 격자: <b>약 ${(gapCells.length * A).toFixed(0)}㎢</b>

function aggColumns() {

    { key: 'sA', label: '교지(㎡, 배분)', val: st => Math.round(st.sA), num: true },
    { key: 'sS', label: '학생', val: st => st.sS, num: true },
    { key: 'sP', label: '1인당(㎡)', val: st => st.sS ? round1(st.sA / st.sS) : null }];
  if (activeLayer === 'trend') return [
    { key: 'tN', label: '비교 가능', val: st => st.tN },
    { key: 'tA', label: `${trendY0()}년 학생`, val: st => st.tA, num: true },
    { key: 'tB', label: `${trendY1()}년 학생`, val: st => st.tB, num: true },
    { key: 'tR', label: '증감률(%)', val: st => st.tA ? round1((st.tB - st.tA) / st.tA * 100) : null, pct: true }];
  if (activeLayer === 'change') return [
    { key: 'comp', label: '비교 가능', val: st => st.comp },
    { key: 'gain', label: '새로 개방', val: st => st.gain },
    { key: 'loss', label: '개방 중단', val: st => st.loss },
    { key: 'net', label: '순변화', val: st => st.gain - st.loss, signed: true },
    ...FACILITIES.map(f => ({ key: 'n' + f, label: FACILITY_SHORT[f] + ' 순', val: st => st.facNet[f] || 0, signed: true }))];
  return FACILITIES.map(f => ({ key: 'f' + f, label: FACILITY_SHORT[f], val: st => st.facOpen[f] || 0 }));
}
function aggRows() {
  const stats = computeGroupStats();
  const cols = aggColumns();
  const isSize = activeLayer === 'size';
  const isChange = activeLayer === 'change';
  const isTrend = activeLayer === 'trend';
  const isSite = activeLayer === 'site';
  const countOnly = isSize || isChange || isTrend || isSite;      // 학교 수만 보여 주고 '개방 학교·개방률' 열은 넣지 않는 레이어
  const rows = groupList().map(g => {
    const st = stats[g];
    const r = { g, total: st.total, open: st.open, base: st.base, pct: st.base ? st.open / st.base : null };
    cols.forEach(c => { r[c.key] = c.val(st); });
    return r;
  });
  // 처음엔 자치구(교육지원청) 가나다순 — 값 순으로 시작하면 순위표처럼 읽혀서(2026-10-02, 판정하지 않는다는 원칙).
  // 머리글을 눌러 고른 열이 이 탭에 없으면(다른 탭에서 고른 열) 가나다순으로 돌아간다.
  const picked = aggSort.col && (aggSort.col === 'g' || (rows[0] && aggSort.col in rows[0]));
  const sortCol = picked ? aggSort.col : 'g';
  const dir = picked ? aggSort.dir : 'asc';
  rows.sort((a, b) => {
    if (!a.total !== !b.total) return a.total ? -1 : 1;   // 지금 조건의 학교가 없는 지역은 늘 맨 아래(화면은 흐리게, 2026-10-14)
    if (sortCol !== 'g' && (a[sortCol] == null || b[sortCol] == null)) return a[sortCol] == null ? (b[sortCol] == null ? 0 : 1) : -1;   // 값 없는 행(—)은 늘 맨 아래
    const cmp = sortCol === 'g' ? a.g.localeCompare(b.g, 'ko') : (a[sortCol] - b[sortCol]);
    return dir === 'asc' ? cmp : -cmp;
  });
  const total = { g: '합계', total: 0, open: 0, base: 0 };
  cols.forEach(c => { total[c.key] = 0; });
  rows.forEach(r => { total.total += r.total; total.open += r.open; total.base += r.base; cols.forEach(c => { total[c.key] += r[c.key] || 0; }); });
  total.pct = total.base ? total.open / total.base : null;
  if (isSize) total.avg = total.cls ? round1(total.stu / total.cls) : null;   // 평균은 합이 아니라 다시 계산
  if (isSite) total.sP = total.sS ? round1(total.sA / total.sS) : null;   // 1인당도 합계로 다시 계산
  if (isTrend) total.tR = total.tA ? round1((total.tB - total.tA) / total.tA * 100) : null;   // 증감률도 합계로 다시 계산
  return { rows, total, cols, countOnly, isSize, isChange, isTrend, sortCol, dir };
}
function setAggSort(col) {

  if (cur === col) aggSort = { col, dir: aggSort.dir === 'asc' ? 'desc' : 'asc' };

}

      <tbody>${rows.map(r => `<tr data-g="${r.g}" class="${activeGroupSet().has(r.g) ? 'sel' : ''}${r.total ? '' : ' no-school'}"${r.total ? '' : ' title="지금 조건에 맞는 학교가 없습니다"'}>${line(r)}</tr>`).join('')}</tbody>

// 내려받을 집계표: CSV와 엑셀이 같은 머리글·행을 쓴다. fmt = 엑셀 열 숫자 형식(학급당·1인당·증감률은 소수 한 자리, 순변화는 +/−)

  rows.push({ k: '있지만 개방 안 함', cells: list.map(s => { const c = s.ex ? [] : by(s, v => v === '무'); return c.length ? { v: facNames(c), dot: 'closed', small: true } : { v: '—' }; }) });
  rows.push({ k: '시설 없음', cells: list.map(s => { const c = s.ex ? [] : by(s, v => v !== '유' && v !== '무'); return c.length ? { v: facNames(c), dot: 'none', small: true } : { v: '—' }; }) });
  if (hasPrevData()) rows.push({ k: '작년 공시와 비교', sub: `${prevYear()} → ${DISCLOSURE_YEAR}`, cells: list.map(s => ({ v: CMP_CHANGE_TEXT[changeKind(s, FACILITIES)], small: true })) });
  if (hasStudentData()) {
    rows.push({ sec: '학생 · 학급' });
    rows.push({ k: '학생 수', cells: list.map(s => stuOf(s) == null ? { v: '—', sub: studentNote(s) || '' } : { v: `${fmtNum(stuOf(s))}명`, sub: `${fmtNum(clsOf(s))}학급` }) });
    rows.push({ k: '학급당 학생', cells: list.map(s => ({ v: avgOf(s) == null ? '—' : `${fix1(avgOf(s))}명`, ref: cmpRefLine(s, perClassOf, r => r ? fix1(r.per) : '—') })) });
  }
  if (hasTrendData()) rows.push({ k: '학생 수 변화', sub: `${trendY0()} → ${trendY1()}`, cells: list.map(s => {
    const e = trendEnds(s);
    return { v: e ? fmtPct(trendRate(s)) : '—', sub: e ? `${fmtNum(e[0])} → ${fmtNum(e[1])}명` : trendNaReason(s), ref: cmpRefLine(s, trendSum, r => fmtPct(r.rate)) };
  }) });
  if (hasSiteData()) {
    rows.push({ sec: '교지 (교사대지 + 체육장)' });
    rows.push({ k: '학생 1명당 교지', cells: list.map(s => {
      const g = (siteInfo(s) || {}).group, others = g ? g.filter(n => n !== s.name).map(shortSchoolName) : [];
      return { v: fmtPer(sitePer(s)), tag: g ? '함께 씀' : '', tip: g ? `${others.join('·')}${josaWa(others[others.length - 1] || '')} 같은 땅을 써서 묶음 면적 ÷ 묶음 학생 수로 계산` : '',
        ref: cmpRefLine(s, siteSum, r => fmtPer(r.per)) };
    }) });
  }
  return rows;
}
function renderCompare() {
  const list = cmpSchools(), body = document.getElementById('cmpBody');
  if (list.length < CMP_MIN) { setCompare(false); return; }
  const rows = cmpRows(list), cols = list.length + 1;
  const head = `<tr><th></th>${list.map(s => `<th title="${esc(s.name)}">${esc(shortSchoolName(s.name))} <span class="cmp-meta">${esc(s.district)}</span></th>`).join('')}</tr>`;
  const cell = c => `<td${c.tip ? ` title="${esc(c.tip)}"` : ''}>${c.dot ? `<span class="badge ${c.dot}"></span>` : ''}<span class="${c.small ? 'cmp-t' : 'cmp-v'}">${esc(c.v)}</span>`
    + (c.tag ? ` <span class="cmp-tag">${esc(c.tag)}</span>` : '') + (c.sub ? `<span class="cmp-sub">${esc(c.sub)}</span>` : '') + (c.ref ? `<span class="cmp-ref">${esc(c.ref)}</span>` : '') + '</td>';
  const tr = r => r.sec ? `<tr class="sec"><td colspan="${cols}">${esc(r.sec)}</td></tr>`
    : `<tr><th scope="row">${esc(r.k)}${r.sub ? `<span class="cmp-sub">${esc(r.sub)}</span>` : ''}</th>${r.cells.map(cell).join('')}</tr>`;
  document.getElementById('cmpTitle').textContent = `고른 학교 나란히 보기 (${list.length}곳)`;
  document.getElementById('cmpPanel').style.setProperty('--cmp-cols', list.length);   // 창 폭 = 학교 수만큼
  body.innerHTML = `<label class="mp-check"><input type="checkbox" id="cmpRefToggle"${cmpShowRef ? ' checked' : ''}> 같은 구·서울 같은 학교급 값도 작게 보기</label>
    <div class="cmp-wrap"><table class="cmp-table"><thead>${head}</thead><tbody>${rows.map(tr).join('')}</tbody></table></div>
    <div class="mp-hint">공시값이라 실제 이용 가능 여부와 다를 수 있습니다.${cmpShowRef ? ' 작은 글씨는 같은 구·서울 같은 학교급 전체를 합쳐 계산한 값입니다.' : ''}</div>`;
  document.getElementById('cmpRefToggle').onchange = e => { cmpShowRef = e.target.checked; renderCompare(); };
}
function setCompare(on) {
  if (on) {
    const n = checked.size;
    if (n < CMP_MIN) { toast(`목록에서 학교를 ${CMP_MIN}곳 이상 체크하면 나란히 볼 수 있습니다.`); return; }
    if (n > CMP_MAX) { toast(`나란히 보기는 ${CMP_MAX}곳까지입니다. 지금 ${n}곳이 골라져 있어요 — 체크를 ${n - CMP_MAX}곳 풀어 주세요.`); return; }
    setAgg(false); setDataPanel(false);
  }
  cmpOpen = on;
  document.getElementById('cmpPanel').classList.toggle('open', on);
  syncPanelOpen();
  if (on) renderCompare();
}
// 엑셀: 화면과 같은 순서. 값 칸에는 값(+ 괄호 안 작은 글씨), 비교 기준은 바로 아래 "  같은 구·서울" 줄에
function cmpToXlsx() {
  const list = cmpSchools(), rows = cmpRows(list);
  const head = ['항목', ...list.map(s => s.name)];
  const out = [];
  rows.forEach(r => {
    if (r.sec) { out.push([r.sec, ...list.map(() => '')]); return; }
    out.push([r.k + (r.sub ? ` (${r.sub})` : ''), ...r.cells.map(c => c.v + (c.tag ? ` · ${c.tag}` : '') + (c.sub ? ` (${c.sub})` : ''))]);
    if (r.cells.some(c => c.ref)) out.push(['   └ 같은 구·서울 같은 학교급', ...r.cells.map(c => c.ref || '')]);
  });
  const notes = ['공시값이라 실제 이용 가능 여부와 다를 수 있습니다. "같은 구·서울 같은 학교급" 줄은 그 학교들을 모두 합쳐 계산한 값입니다(학교별 값의 평균이 아님).',
    ...csvSourceLines(['facility', 'change', 'size', 'trend', 'site'])];
  return buildXlsx({ sheetName: '학교 나란히', title: `서울 학교 공간 지도 · 고른 학교 나란히 보기 (${list.length}곳)`, subtitle: list.map(s => `${s.name}(${s.district})`).join(' · '),
    head, headTab: head.map(() => false), rows: out, notes });
}

// ---------------- 데이터 점검 패널 ----------------
function nameList(title, arr, hint, open) {
  if (!arr.length) return `<div class="data-list">${title}: <span class="data-ok">없음</span></div>`;
  const MAX = 60;
  return `<details class="data-list" ${open ? 'open' : ''}><summary>${title}: <span class="data-warn">${arr.length}건</span></summary>
    <div class="names">${arr.slice(0, MAX).map(esc).join(', ')}${arr.length > MAX ? ` 외 ${arr.length - MAX}건` : ''}
    ${hint ? `<div class="mp-hint">${hint}</div>` : ''}</div></details>`;
}
// 데이터 점검(관리자용): 원자료 현황, 지도에 못 올린 학교, 확인이 필요한 항목을 보여 준다
function renderDisclosureDataPanel() {
  const cnt = (arr, f) => arr.reduce((o, x) => { const k = f(x); o[k] = (o[k] || 0) + 1; return o; }, {});
  const byFound = cnt(SCHOOLS, s => s.found || '?');
  const noCoord = SCHOOLS.filter(s => s.noCoord);
  const noCoordByFound = cnt(noCoord, s => s.found || '?');
  const ex = SCHOOLS.filter(s => s.ex).map(s => `${s.name}(${s.found}) — ${s.ex}`);
  const coordIssueTotal = SCHOOLS.filter(isGenuineCoordIssue).length;
  const unassigned = SCHOOLS.filter(s => s.office === '미분류').map(s => `${s.name}(${s.district})`);
  const fmtFound = o => FOUNDS.map(k => `${k} ${o[k] || 0}`).join(' · ');
  // 공시의 자치구와 NEIS 연락처 주소의 자치구를 매번 대조한다(2026-10-01, 연락처가 1,366개교 전부 들어온 뒤 공시 학교 전체로 확장)
  const addrDistrictIssues = computeAddrDistrictIssues();
  const noContact = SCHOOLS.filter(s => !contactOf(s.name)).map(s => `${s.name}(${s.found})`);
  // 학생·학급수 한쪽만 없는 학교·공식 미확인 학교 상태도 합계에 넣는다(2026-10-02)
  const partialStudent = hasStudentData()
    ? SCHOOLS.filter(x => { const n = studentNote(x); return n === '학생수 미공시' || n === '학급수 미공시'; })
        .map(x => `${x.name}(${x.district}) — ${studentNote(x)}`)
    : [];
  const statusUnofficial = typeof SCHOOL_STATUS !== 'undefined'
    ? SCHOOLS.filter(x => statusOf(x.name) && statusOf(x.name).official === false)
        .map(x => `${x.name}(${x.district}) — ${statusOf(x.name).label}`) : [];
  const checkTotal = noCoord.length + coordIssueTotal + unassigned.length + addrDistrictIssues.length + partialStudent.length + statusUnofficial.length;
  let html = `<div class="mp-sum">학교알리미 정보공시 <b>${typeof DISCLOSURE_YEAR !== 'undefined' ? DISCLOSURE_YEAR : '?'}년</b> · 수집일 ${esc(typeof DISCLOSURE_DATA_DATE !== 'undefined' ? DISCLOSURE_DATA_DATE : '?')} · <b>${SCHOOLS.length}</b>개교 (${fmtFound(byFound)})</div>`;
  html += `<div class="mp-sub-title">정확도 요약</div>`;
  html += `<div class="data-list">확인이 필요한 항목 합계: <b class="${checkTotal ? 'data-warn' : 'data-ok'}">${checkTotal}건</b> (위치 누락 ${noCoord.length} · 좌표 확인 필요 ${coordIssueTotal} · 교육지원청 미분류 ${unassigned.length} · 자치구 주소 불일치 ${addrDistrictIssues.length} · 학생·학급수 한쪽만 없음 ${partialStudent.length} · 학교 상태 공식 미확인 ${statusUnofficial.length})</div>`;
  html += nameList('학급수·학생수 중 한쪽만 없는 학교', partialStudent, '학교알리미 공시 자체가 한쪽 값만 비어 있는 경우입니다(위탁교육 각종학교 등). 공식 사유가 확인되면 data/corrections.js에 남겨 두세요.', true);
  html += nameList('학교 상태를 공식 자료로 확인하지 못한 학교', statusUnofficial, 'data/corrections.js의 SCHOOL_STATUS에서 official: false인 학교입니다. 교육지원청·학교 공고로 확인되면 official: true로 바꾸세요.', true);
  html += `<div class="mp-hint">학교 공시값이라 실제 이용 가능 여부와 다를 수 있습니다.</div>`;
  html += `<div class="mp-sub-title">좌표</div>`;
  html += `<div class="data-list">위치 누락(표에만 나오고 지도에는 안 보임): <b>${noCoord.length}</b>개교 (${fmtFound(noCoordByFound)})</div>`;
  const extraN = SCHOOLS.filter(s => s.coordSrc).length;

  html += nameList('교육지원청 미분류 학교', unassigned, 'data/corrections.js의 OFFICE_OF_DISTRICT에 자치구를 추가하세요.', true);

  html += nameList('연락처가 없는 학교', noContact, '연락처수집기.html을 다시 실행하고, 매칭 실패·동명 후보는 corrections.js의 CONTACT_ALIAS로 해결하세요.', true);
  html += nameList('자치구 주소 불일치(공시 자치구 vs NEIS 연락처 주소)', addrDistrictIssues, '두 공식자료(학교알리미 공시·NEIS)의 자치구가 다릅니다. 학교가 이전했는데 한쪽 자료만 갱신되지 않은 경우일 수 있어 확인이 필요합니다. 이전이 맞으면 data/corrections.js의 VERIFIED_DISTRICT_MOVES에 추가하세요.', true);
  html += `<div class="mp-sub-title">공시 제외</div>`;
  html += nameList('공시 제외 학교(사유 원문)', ex, '다른 학교가 대신 관리하는 경우(병설·이음학교 등)와 개방하지 않는 경우가 섞여 있어 자동으로 분류하지 않고 사유를 그대로 보여 줍니다. 통계에서는 개방·미개방 어느 쪽에도 넣지 않습니다.', true);
  html += `<div class="mp-sub-title">갱신 방법</div>`;
  html += `<div class="mp-hint">엑셀 매크로(Claude outputs/학교알리미_시설개방_받기.xlsm)로 새 공시를 받은 뒤, <b>공시변환기.html</b>에서 변환해 <code>data/disclosure.js</code>에 덮어쓰세요.</div>`;
  document.getElementById('dataBody').innerHTML = html;
}

if (window.matchMedia) window.matchMedia(PAGED_LIST_MQ).addEventListener('change', () => renderList());

// ---------------- 지금 화면을 링크로(2026-10-03, 목적 검토 6번) ----------------
// 탭·늘 적용 조건·탭 전용 조건·비교 기간·검색·정렬·고른 학교를 주소 끝(#…)에 담는다. 받은 사람이 열면 같은 화면.
// 기본값은 담지 않아 처음 화면은 주소가 깔끔하다. 서버로 보내지 않는 # 부분이라 망분리·오프라인에서도 그대로 동작.
const HASH_DEFAULT_CHANGES = 'gain,loss';
const setStr = set => [...set].join(',');
function stateToHash() {
  const p = new URLSearchParams();
  if (activeLayer !== 'facility') p.set('t', activeLayer);
  if (groupUnit !== 'district') p.set('u', groupUnit);
  if (activeGroupSet().size) p.set('g', setStr(activeGroupSet()));
  if (activeLevels.size) p.set('lv', setStr(activeLevels));
  if (activeFounds.size) p.set('fd', setStr(activeFounds));
  if (activeFacilities.size) p.set('f', setStr(activeFacilities));
  if (onlyOpen) p.set('open', '1');
  const ch = CHANGE_ORDER.filter(k => activeChanges.has(k)).join(',');
  if (ch !== HASH_DEFAULT_CHANGES) p.set('ch', ch || 'all');
  Object.keys(activeBins).forEach(L => { if (activeBins[L].size) p.set('b' + L, [...activeBins[L]].sort((a, b) => a - b).join(',')); });
  if (activeSiteKinds.size) p.set('sk', setStr(activeSiteKinds));
  if (activeTrendKinds.size) p.set('tk', setStr(activeTrendKinds));
  if (hasTrendData() && TREND_PRESETS.length && TREND_YEARS[trendI1] - TREND_YEARS[trendI0] !== TREND_PRESETS[0].span) p.set('span', TREND_YEARS[trendI1] - TREND_YEARS[trendI0]);
  if (searchTerm) p.set('q', searchTerm);
  if (sortColumn) p.set('s', `${sortColumn}:${sortDir}`);
  if (selectedSchool) p.set('sel', selectedSchool);
  return p.toString();
}
let hashReady = false;   // 주소에서 상태를 다 읽기 전에는 주소를 덮어쓰지 않는다
function syncHash() {
  if (!hashReady) return;
  const h = stateToHash();
  const url = location.pathname + location.search + (h ? '#' + h : '');
  if (url !== location.pathname + location.search + location.hash) history.replaceState(null, '', url);
}
// 부팅 때: 주소의 값을 상태 변수에 넣는다(모르는 값은 버림). 화면 그리기는 boot가 이어서 한다.
function readHashState() {
  const p = new URLSearchParams(location.hash.slice(1));
  const list = (k, ok) => (p.get(k) || '').split(',').filter(v => v && ok(v));
  const fill = (set, k, ok) => { set.clear(); list(k, ok).forEach(v => set.add(v)); };
  const st = { layer: null, sel: null };
  if (LAYER_NAME[p.get('t')] && !document.querySelector(`#layerTabs button[data-layer="${p.get('t')}"]`)?.disabled) st.layer = p.get('t');
  if (p.get('u') === 'office') {
    groupUnit = 'office';
    document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === 'office'));
  }
  fill(activeGroupSet(), 'g', v => groupList().includes(v));
  document.getElementById('districtSelectLabel').textContent = activeGroupSet().size ? groupLabelText() : '전체 ' + unitLabel();
  fill(activeLevels, 'lv', v => levels.includes(v));
  fill(activeFounds, 'fd', v => SCHOOLS.some(s => s.found === v));
  fill(activeFacilities, 'f', v => FACILITIES.includes(v));
  if (p.get('open') === '1') { onlyOpen = true; const t = document.getElementById('onlyOpenToggle'); if (t) t.checked = true; }
  if (p.has('ch')) fill(activeChanges, 'ch', v => v in CHANGE_KINDS);
  Object.keys(activeBins).forEach(L => { activeBins[L].clear(); list('b' + L, v => /^\d+$/.test(v) && +v < BIN_LAYERS[L].bins().length).forEach(v => activeBins[L].add(+v)); });
  fill(activeSiteKinds, 'sk', v => v in SITE_KINDS);
  fill(activeTrendKinds, 'tk', v => v in TREND_KINDS);
  const span = +p.get('span');
  if (span && hasTrendData()) { const i0 = TREND_YEARS.indexOf(TREND_YEARS[trendI1] - span); if (i0 >= 0) trendI0 = i0; }
  if (p.get('q')) { searchTerm = p.get('q').trim(); searchInput.value = searchTerm; updateSearchClear(); }
  const [sc, sd] = (p.get('s') || '').split(':');
  if (sc && (SORT_COL_LABEL[sc] || FACILITIES.includes(sc) || LAYER_ONLY_SORT[sc])) { sortColumn = sc; sortDir = sd === 'desc' ? 'desc' : 'asc'; }
  if (p.get('sel') && SCHOOL_BY_NAME[p.get('sel')]) st.sel = p.get('sel');
  return st;
}
async function copyViewLink() {
  syncHash();
  const ok = await copyText(location.href);
  toast(ok ? '지금 화면 링크를 복사했습니다. 받은 사람이 열면 같은 탭·조건으로 보입니다.' : '복사하지 못했습니다. 주소창의 주소를 직접 복사해 주세요.');
}
document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('#copyLinkBtn')) copyViewLink(); });
// 이미 열린 화면에서 다른 링크를 주소창에 붙여 넣으면(# 부분만 바뀜) 그 상태로 다시 연다
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== stateToHash()) location.reload(); });

// ---------------- "이 지도 보는 법" 창(2026-10-03) ----------------
// 처음 보는 정책 담당자가 원칙(판정하지 않음·공시값 ≠ 이용 가능)과 화면 읽는 법을 알고 시작하게. 활용_안내.md 1~3·6절을 줄인 것.
// 숫자·연도는 자료에서 읽어 와 갱신 때 고칠 필요 없음. 처음 방문에 한 번 자동으로 열고(브라우저 저장소, 안 되면 매번 안 염), 그 뒤엔 제목 옆 버튼.
const HELP_SEEN_KEY = 'seoulSchoolSpaceMap.helpSeen';
function helpHtml() {
  const y = typeof DISCLOSURE_YEAR !== 'undefined' ? DISCLOSURE_YEAR : '';
  const key = t => `<span class="help-key">${t}</span>`;
  const rows = [
    ['시설 개방', '어느 학교가 어떤 시설을 개방한다고 공시했나?'],
    hasPrevData() && ['개방 변화', `${prevYear()}년보다 새로 개방하거나 개방을 중단한 학교는?`],
    hasStudentData() && ['학생·학급', '학교마다 학생·학급이 얼마나 되나?'],
    hasTrendData() && ['학생 수 추이', `${TREND_YEARS[0]}~${TREND_YEARS[TREND_YEARS.length - 1]}년 학생 수가 얼마나 늘거나 줄었나?`],
    hasSiteData() && ['교지 면적', '학생 1인당 학교 땅은 얼마나 되나?'],
  ].filter(Boolean);
  return `
    <ul class="help-lead">
      <li>서울 학교 ${fmtNum(SCHOOLS.length)}곳의 <b>공간</b>(시설 개방·학생 수·학교 부지)을 학교알리미 ${y} 공시로 봅니다.</li>
      <li><b>값과 비교 기준만</b> 보여 줍니다. 좋다·나쁘다는 판정은 하지 않습니다.</li>
      <li><b>공시값은 실제 이용 가능 여부와 다를 수 있습니다.</b> 이용은 학교 카드의 연락처로 확인해 주세요.</li>
    </ul>
    <h3>탭마다 답하는 질문</h3>
    <table>${rows.map(([t, q]) => `<tr><th>${t}</th><td>${q}</td></tr>`).join('')}</table>
    <details class="help-more"><summary>화면 읽는 법·읽을 때 주의 더 보기</summary>
    <p class="help-detail-lead">값은 같은 구·같은 학교급, 서울 전체, 전년과 나란히 보여 주며, 색은 방향과 크기만 나타냅니다. 교지는 교사대지+체육장이고 건물 면적이 아닙니다.</p>
    <h3>화면 읽는 법</h3>
    <ul>
      <li><b>맨 위 숫자 줄</b>은 조건이 없으면 <b>서울 전체</b> 값입니다. 자치구·학교급·설립·검색 조건을 걸면 그 조건의 값이 크게, 서울 전체가 아래 작게 나옵니다(탭 안 칩으로 학교를 거르지는 않고, 시설 개방 탭에서 시설을 고르면 그 시설 기준으로 개방·미개방을 셈). 학교급별·시설별 합계는 조건 줄의 ${key('요약 ▾')} 에 있습니다.</li>
      <li><b>자치구·학교급·설립</b>은 어느 탭에서나 걸리는 조건입니다. 탭에서만 쓰는 조건(시설, 구간, 비교 기간 등)은 "○○ 탭에서 골라 보기"의 ${key('펼치기 ▾')}를 눌러 엽니다.</li>
      <li>지도를 <b>축소</b>하면 자치구(또는 교육지원청)별 색과 숫자가, <b>확대</b>하면 학교 핀과 묶음 원(숫자 = 학교 수)이 보입니다. 자치구 숫자는 그 구의 값이라, 탭에서 고른 칩은 반영되지 않습니다.</li>
      <li>학교 핀이나 목록의 학교를 누르면 <b>학교 카드</b>가 열립니다. 지금 탭과 관련된 내용이 펼쳐져 있습니다.</li>
      <li>지도 위 ${key('반경 검색')} 은 한 지점 주변의 학교를 거리순으로, ${key('반경 밖 영역')} 은 개방 학교에서 일정 거리 밖인 영역(추정)을, ${key('집계표')} 는 자치구·교육지원청별 합계를 보여 줍니다. 목록과 집계표는 엑셀(서식 포함)·CSV로 받을 수 있습니다(목록은 정렬 옆 ${key('내려받기 ▾')}).</li>
      <li>목록에서 학교 2~4곳을 체크하면 아래 ${key('나란히 보기')} 로 시설·학생·추이·교지를 한 표에서 견줄 수 있습니다(숫자 아래에 같은 구·서울 같은 학교급 값, 순위 없음).</li>
      <li>정렬 줄 오른쪽 ${key('🔗 링크')} 로 지금 탭·조건·고른 학교를 담은 주소를 동료에게 보낼 수 있습니다. 받은 사람이 열면 같은 화면이 나옵니다.</li>
    </ul>
    <h3>읽을 때 주의</h3>
    <ul>
      <li>개방 공시는 해마다 학교의 5~14%에서 바뀌고 일부는 다음 해 되돌아갑니다. 한 해 변화만으로 단정하지 마세요.</li>
      <li>휴교 학교는 공시가 "개방"이어도 닫힌 것으로 셉니다. 공사 중인 학교는 카드에 안내가 붙습니다.</li>
      <li>반경은 직선거리이고, 인구는 반영하지 않았습니다.</li>
    </ul></details>`;
}
let helpReturnFocus = null;
function openHelp() {
  document.getElementById('helpBody').innerHTML = helpHtml();
  helpReturnFocus = document.activeElement;
  document.getElementById('helpModal').hidden = false;
  document.getElementById('helpBody').scrollTop = 0;
  document.getElementById('helpOk').focus();
  try { localStorage.setItem(HELP_SEEN_KEY, '1'); } catch (e) { /* 저장 못 해도 창은 동작 */ }
}
function closeHelp() {
  document.getElementById('helpModal').hidden = true;
  // 처음 자동으로 열린 경우처럼 돌아갈 곳이 없으면 "보는 법" 버튼으로(숨긴 창 안에 초점이 남지 않게)
  const back = helpReturnFocus && helpReturnFocus !== document.body && document.contains(helpReturnFocus) && !helpReturnFocus.closest('#helpModal') ? helpReturnFocus : document.getElementById('helpBtn');
  back.focus();
}
function initHelp() {
  const modal = document.getElementById('helpModal');
  document.getElementById('helpBtn').onclick = openHelp;
  document.getElementById('helpClose').onclick = closeHelp;
  document.getElementById('helpOk').onclick = closeHelp;
  modal.onclick = e => { if (e.target === modal) closeHelp(); };   // 바깥(어두운 곳)을 누르면 닫힘
  modal.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); closeHelp(); return; }
    if (e.key !== 'Tab') return;   // 창이 열려 있는 동안 Tab이 창 밖으로 나가지 않게
    const f = [...modal.querySelectorAll('button')], first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  let seen = false;
  try { seen = !!localStorage.getItem(HELP_SEEN_KEY); } catch (e) { seen = true; }   // 저장소를 못 쓰면 매번 띄우지 않음
  if (!seen) openHelp();
}

async function boot() {
  computeCoordIssues();
  const fromHash = readHashState();   // 공유 링크(#…)로 열었으면 그 탭·조건으로 시작
  renderListNote();
  renderFilterChips();
  // 데이터 점검은 관리자용이라 주소 끝에 ?admin을 붙여 열었을 때만 버튼을 보인다(2026-10-02).
  // 공개본(GitHub Pages)에서는 공개본_만들기.js가 ADMIN_PANEL을 false로 바꿔 ?admin을 붙여도 안 보이게 한다(2026-10-05)
  const ADMIN_PANEL = false;   // 공개본: 점검 패널 끔(공개본_만들기.js)
  document.getElementById('toolData').hidden = !(ADMIN_PANEL && new URLSearchParams(location.search).has('admin'));
  document.getElementById('loading').hidden = true;
  bindUi();
  renderTabFilters();   // 탭 전용 골라 보기 묶음(처음 탭 = 시설 개방)
  initMap(); // 실패해도 catch에서 처리되고 아래 렌더링은 계속 진행된다
  // 지도가 없으면 지도 위에서만 쓰는 도구는 눌러도 안내만 뜨므로 아예 숨긴다(집계표는 지도 없이도 동작, 2026-10-02)
  document.getElementById('toolRadius').hidden = document.getElementById('toolGap').hidden = !mapAvailable;
  renderTopBar();
  renderList();
  syncMapMarkers();
  updateLegend();
  updateSelBar();
  renderRadiusResult();
  fitMapTop(true);
  if (fromHash.layer) setLayer(fromHash.layer);
  if (mapAvailable && (activeGroupSet().size || activeLevels.size || searchTerm)) { updateMapViewMode(); syncOfficeCard(); focusMap(filteredSchools()); }
  if (fromHash.sel) selectSchool(SCHOOL_BY_NAME[fromHash.sel]);
  hashReady = true;
  syncHash();
  initHelp();
}
boot();
